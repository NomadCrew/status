# NomadCrew status monitor configuration
# Probes run from GitHub Actions (external vantage), so a Dubai VM outage is visible.
# Probe targets verified live 2026-08-20; see workspace docs for the health-surface map.
owner: NomadCrew
repo: status
user-agent: nomadcrew-status-monitor

sites:
  # Single best probe: backend returns 503 if Postgres, Redis, or migrations are down/dirty
  - name: Backend API (DB, Redis, migrations)
    url: https://api.nomadcrew.uk/health/readiness
  # 401 is the healthy answer: proves routing + auth middleware are wired
  - name: API routing and auth
    url: https://api.nomadcrew.uk/v1/trips
    expectedStatusCodes:
      - 401
  # The apikey below is Supabase's PUBLISHABLE anon key (ships in every client app;
  # RLS enforces security). Embedded literally because secret substitution does not
  # apply inside headers.
  - name: Supabase auth
    url: https://kijatqtrwdzltelqzadx.supabase.co/auth/v1/health
    headers:
      - "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtpamF0cXRyd2R6bHRlbHF6YWR4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk5Mzg0NTYsImV4cCI6MjA4NTUxNDQ1Nn0.LL4YlGqp6q_4u-EavgL6GlT9gByYVRB9irRRkT7lZuU"
  - name: Landing site
    url: https://nomadcrew.uk
  - name: Landing functions (image proxy)
    url: https://nomadcrew.uk/api/unsplash
  # Fly auto-stop app: cold starts can exceed 15s, so degraded threshold is generous
  - name: Umami analytics
    url: https://nomadcrew-umami.fly.dev/script.js
    maxResponseTime: 60000
  # 403 is the healthy answer: Coolify dashboard is deliberately webhook-only public
  - name: Coolify deploy endpoint
    url: https://coolify.nomadcrew.uk
    expectedStatusCodes:
      - 403

status-website:
  baseUrl: /status
  name: NomadCrew Status
  introTitle: "**NomadCrew** service status"
  introMessage: Live health of the NomadCrew stack, probed every 5 minutes from GitHub Actions. The backend check covers the API plus its database, Redis, and migration state; Supabase auth, the landing site, and analytics are probed separately.
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/NomadCrew
